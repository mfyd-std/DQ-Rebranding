[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify automatically provisions its Next.js runtime for this build.
# Preserve public legacy URLs after replacing the HTML site.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/program.html"
  to = "/program"
  status = 301

[[redirects]]
  from = "/tentang.html"
  to = "/tentang"
  status = 301

[[redirects]]
  from = "/jelajahi.html"
  to = "/jelajahi"
  status = 301

[[redirects]]
  from = "/dq3.html"
  to = "/dq3"
  status = 301

[[redirects]]
  from = "/kontak.html"
  to = "/kontak"
  status = 301

[[redirects]]
  from = "/berita.html"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/berita-perpustakaan.html"
  to = "/blog/kolaborasi-literasi-dzaizza"
  status = 301

[[redirects]]
  from = "/berita-paskibraka.html"
